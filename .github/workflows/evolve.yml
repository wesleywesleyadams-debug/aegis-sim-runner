# Evolution of the scripted AI (Aegis-Matrix docs/AI_DESIGN.md, "Evolution").
# One run = one generation: plan (breed genomes from the parent run's state),
# stage 1 (every genome plays per/2 games), stage 2 (the top half plays
# per/2 more), score (champion ladder: see tools/evolve.py), then start the
# next generation itself until `gens` reaches 0. Only genome JSON and result lines are
# uploaded; game files never leave the job.
name: Evolve AI
run-name: "${{ inputs.mode }}: gen ${{ inputs.parent_run == '' && '0' || 'next' }} (${{ inputs.gens }} left) ${{ inputs.game_ref }}"

on:
  workflow_dispatch:
    inputs:
      game_ref:
        description: "Game branch with genome support"
        default: "main"
      mode:
        description: "evolve, or validate (parent_run's hall of fame, `per` games each vs ref)"
        type: choice
        options: [evolve, validate]
        default: evolve
      parent_run:
        description: "Run id of the previous generation ('' = start fresh)"
        default: ""
      gens:
        description: "Generations left to run (this one included)"
        default: "1"
      per:
        description: "Games per genome per generation (half vs the baseline; the top half of genomes plays the second half)"
        default: "16"
      only:
        description: "validate: genome ids to test (space separated, '' = whole hall of fame)"
        default: ""
      minutes:
        default: "60"
      speed:
        default: "4"

permissions:
  contents: read
  actions: write

env:
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip

jobs:
  plan:
    if: github.repository_owner == 'wesleywesleyadams-debug'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wesleywesleyadams-debug/Aegis-Matrix
          ssh-key: ${{ secrets.AEGIS_DEPLOY_KEY }}
          ref: ${{ inputs.game_ref }}
          persist-credentials: false
      - name: Previous generation
        if: inputs.parent_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.parent_run }} -R ${{ github.repository }} -n evo-state -D prev
      - id: p
        env:
          EVO_ONLY: ${{ inputs.only }}
        run: |
          S=prev/state.json; [ -f "$S" ] || S=-
          CMD=plan; [ "${{ inputs.mode }}" = validate ] && CMD=vplan
          echo "matrix=$(python3 tools/evolve.py $CMD $S evo ${{ inputs.per }})" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: evo-plan
          path: evo/

  games:
    needs: plan
    uses: ./.github/workflows/evo-games.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}
      game_ref: ${{ inputs.game_ref }}
      minutes: ${{ inputs.minutes }}
      speed: ${{ inputs.speed }}
    secrets:
      AEGIS_DEPLOY_KEY: ${{ secrets.AEGIS_DEPLOY_KEY }}

  # Stage 2: the top half by stage-1 fitness plays the rest of its games
  # (skipped for validation, and on game refs whose evolve.py has no plan2).
  mid:
    needs: [plan, games]
    if: always() && needs.plan.result == 'success' && inputs.mode == 'evolve'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wesleywesleyadams-debug/Aegis-Matrix
          ssh-key: ${{ secrets.AEGIS_DEPLOY_KEY }}
          ref: ${{ inputs.game_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dl
      - id: p
        run: |
          M='[]'
          grep -q "def plan2" tools/evolve.py && M=$(python3 tools/evolve.py plan2 ${{ runner.temp }}/dl/evo-plan/plan.json ${{ runner.temp }}/dl)
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  games2:
    needs: mid
    if: always() && needs.mid.result == 'success' && needs.mid.outputs.matrix != '[]'
    uses: ./.github/workflows/evo-games.yml
    with:
      matrix: ${{ needs.mid.outputs.matrix }}
      game_ref: ${{ inputs.game_ref }}
      minutes: ${{ inputs.minutes }}
      speed: ${{ inputs.speed }}
    secrets:
      AEGIS_DEPLOY_KEY: ${{ secrets.AEGIS_DEPLOY_KEY }}

  score:
    needs: [plan, games, mid, games2]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wesleywesleyadams-debug/Aegis-Matrix
          ssh-key: ${{ secrets.AEGIS_DEPLOY_KEY }}
          ref: ${{ inputs.game_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dl
      - name: Score
        run: |
          mkdir -p state
          python3 tools/evolve.py score ${{ runner.temp }}/dl/evo-plan/plan.json ${{ runner.temp }}/dl state/state.json | tee -a "$GITHUB_STEP_SUMMARY"
          cat ${{ runner.temp }}/dl/evo-games-*/genome_*.txt > state/genome_log.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: evo-state
          path: state/
      - name: Next generation
        if: inputs.gens > 1 && inputs.mode == 'evolve'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run evolve.yml -R ${{ github.repository }} \
            -f game_ref=${{ inputs.game_ref }} -f parent_run=${{ github.run_id }} \
            -f gens=$(( ${{ inputs.gens }} - 1 )) -f per=${{ inputs.per }} \
            -f minutes=${{ inputs.minutes }} -f speed=${{ inputs.speed }}
