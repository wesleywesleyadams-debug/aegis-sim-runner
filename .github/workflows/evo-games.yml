# Plays one batch of Evolve AI games (called by evolve.yml; not run by hand).
# Each job plays the games in its "games" list ("p1,p2,system,seed" ...), two
# at once. "ref" = the baseline: the run's promoted champion (pop/ref.json)
# if there is one, else the game's own default.
name: Evolve AI games

on:
  workflow_call:
    inputs:
      matrix: {type: string, required: true}
      game_ref: {type: string, required: true}
      minutes: {type: string, required: true}
      speed: {type: string, required: true}
    secrets:
      AEGIS_DEPLOY_KEY: {required: true}

env:
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wesleywesleyadams-debug/Aegis-Matrix
          ssh-key: ${{ secrets.AEGIS_DEPLOY_KEY }}
          ref: ${{ inputs.game_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: evo-plan
          path: ${{ runner.temp }}/evo
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: godot.zip
          key: godot-${{ env.GODOT_URL }}
      - name: Get Godot
        run: |
          # Retry the download (GitHub releases sometimes 504) and only
          # accept a file that is a valid zip; the cache skips it entirely.
          for i in 1 2 3 4 5 6 7 8; do
            unzip -tq godot.zip >/dev/null 2>&1 && break
            rm -f godot.zip
            curl -sSL --retry 3 --max-time 300 "$GODOT_URL" -o godot.zip || true
            unzip -tq godot.zip >/dev/null 2>&1 && break
            echo "download try $i failed"; sleep $((i * 20))
          done
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import assets
        run: ./godot --headless --import --path . || true
      - name: Play
        env:
          POP: ${{ runner.temp }}/evo/pop
          MINUTES: ${{ inputs.minutes }}
          SPEED: ${{ inputs.speed }}
          JOB: ${{ matrix.job }}
        run: |
          mkdir -p out
          play() {
            IFS=, read -r P1 P2 SYS SEED <<< "$1"
            gfile() { [ -f "$POP/$1.json" ] && echo "$POP/$1.json" || echo ""; }
            NOV=""; [ -f "$POP/novelty.json" ] && NOV="$POP/novelty.json"
            SL_NOVELTY_FILE="$NOV" SL_EXPLORE=1 SL_GENOME_1="$(gfile $P1)" SL_GENOME_2="$(gfile $P2)" SL_SYSTEM=$SYS SL_SIM=evo_$SEED SL_SEED=$SEED SL_PLAYERS=2 \
            SL_SIM_MINUTES=$MINUTES SL_SIM_SCALE=$SPEED \
              timeout 6000 ./godot --headless --fixed-fps 60 --path . scenes/Main.tscn > "out/$SEED.log" 2>&1 || true
            grep -E "^GENOME" "out/$SEED.log" | sed "s/^/[$SEED] /" >> out/genome_$JOB.txt || true
            # Options each side took (EVOTRIED), by genome id: the champion's tried set.
            grep "^EVOTRIED" "out/$SEED.log" | awk -v a="$P1" -v b="$P2" '{print "TRIED", ($2 == "P1" ? a : b), $3}' >> out/tried_$JOB.txt || true
            # P1's share of the two sides' net worth, averaged over the game
            # (EVONW lines, once a game minute; absent on older game refs).
            NW=$(grep "^EVONW" "out/$SEED.log" | awk '{a=$3; b=$4; sub("p1=","",a); sub("p2=","",b); if (a+b > 0) {s += a/(a+b); n++}} END {if (n) printf " nwshare=%.3f", s/n}')
            grep -m1 "SIM RESULT" "out/$SEED.log" | sed "s/^/EVO p1=$P1 p2=$P2 seed=$SEED /; s/\$/$NW/" >> out/evo_$JOB.txt || true
            echo "script errors: $(grep -c 'SCRIPT ERROR' out/$SEED.log)" >> out/genome_$JOB.txt
            rm -f "out/$SEED.log"
          }
          export -f play
          printf '%s\n' ${{ matrix.games }} | xargs -P 2 -I{} bash -c 'play {}'
          cat out/evo_$JOB.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: evo-games-${{ matrix.job }}
          path: out/
